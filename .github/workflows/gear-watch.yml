name: Gear Watch

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: gear-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Unpack the uploaded zip (first setup only)
        id: setup
        run: |
          shopt -s nullglob
          for z in gear-watch*.zip; do
            unzip -o -q "$z" -x '.github/*' '__MACOSX/*'
            rm -f "$z"
            echo "Unpacked $z"
          done
          if [ ! -d scripts ] && [ -d gear-watch/scripts ]; then cp -r gear-watch/. . && rm -rf gear-watch; fi
          if [ -f scripts/run.mjs ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Upload gear-watch.zip to this repo to finish setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Check prices
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save price history
        if: steps.setup.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -q -m "Gear Watch check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v6
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          path: site

      - id: deploy
        if: steps.setup.outputs.ready == 'true'
        uses: actions/deploy-pages@v5
